<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Englisch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EC">
<title>Englisch für unterwegs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
  @font-face{font-family:"Fraunces";font-weight:500 700;font-style:normal;font-display:swap;src:url(fonts/fraunces-latin-600-normal.woff2) format("woff2")}
  :root{
    --bg:#F7F3EC; --card:#FFFFFF; --ink:#1E2638; --muted:#566074; --line:#E5DED1;
    --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#E2EFE9;
    --warm:#B9532F; --warm-soft:#FBEAE2; --sun:#F2C14E;
    --radius:22px; --shadow:0 1px 2px rgba(30,38,56,.06),0 6px 20px rgba(30,38,56,.07);
    --scale:1;
  }
  *{box-sizing:border-box}
  html{font-size:calc(21px * var(--scale)); -webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",-apple-system,system-ui,sans-serif;line-height:1.45}
  button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
  #app{max-width:780px;margin:0 auto;padding:18px 20px 260px}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
  h1{font-size:1.9rem;line-height:1.15}
  h2{font-size:1.4rem;line-height:1.2}
  h3{font-size:1.15rem}
  .muted{color:var(--muted)}
  .small{font-size:.86rem}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;min-height:64px;margin-bottom:10px}
  .bar .title{flex:1;font-weight:700;font-size:1rem;color:var(--muted);text-align:center}
  .iconbtn{min-width:64px;min-height:56px;padding:0 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.95rem}
  .iconbtn:active{transform:scale(.98)}
  .spacer{min-width:64px}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
  .stack>*+*{margin-top:16px}

  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;padding:14px 22px;border-radius:18px;border:none;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
  .btn.secondary{background:var(--card);color:var(--ink);border:2px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent);min-height:56px}
  .btn:disabled{opacity:.4}
  .btn:active:not(:disabled){transform:scale(.99)}

  /* home */
  .hello{padding:8px 4px 6px}
  .hello p{margin:.35rem 0 0;font-size:1.05rem}
  .daily{background:linear-gradient(135deg,#1F6F5C,#2C8A72);color:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .daily .lab{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
  .daily .en{font-family:"Fraunces",Georgia,serif;font-size:1.55rem;line-height:1.2;margin:.4rem 0 .2rem}
  .daily .de{opacity:.9}
  .daily .row{display:flex;gap:10px;margin-top:16px}
  .pill{min-height:56px;padding:0 20px;border-radius:999px;border:none;font-weight:700;background:rgba(255,255,255,.18);color:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:none;text-align:left;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
  .tile .big{font-size:1.7rem}
  .tile b{font-size:1.05rem}
  .tile span{color:var(--muted);font-size:.86rem}
  .sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin:30px 4px 12px}
  .lesson{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:none;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;text-align:left;min-height:92px}
  .lesson+.lesson{margin-top:12px}
  .lesson .ico{flex:none;width:60px;height:60px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.7rem}
  .lesson .txt{flex:1;min-width:0}
  .lesson .txt b{display:block;font-size:1.05rem}
  .lesson .txt span{color:var(--muted);font-size:.86rem}
  .badge{flex:none;font-size:.78rem;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--bg);color:var(--muted)}
  .badge.ok{background:var(--accent-soft);color:var(--accent)}
  .badge.next{background:var(--warm-soft);color:var(--warm)}

  /* lesson hub */
  .hubhead{display:flex;gap:18px;align-items:center}
  .hubhead .ico{width:84px;height:84px;border-radius:24px;background:var(--accent-soft);display:grid;place-items:center;font-size:2.4rem;flex:none}
  .step{display:flex;align-items:center;gap:16px;width:100%;border:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-align:left;min-height:88px}
  .step+.step{margin-top:12px}
  .step .num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
  .step b{display:block}
  .step span{color:var(--muted);font-size:.86rem}

  /* phrase cards */
  .phrase{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 20px 16px}
  .phrase+.phrase{margin-top:14px}
  .phrase .en{font-family:"Fraunces",Georgia,serif;font-size:1.35rem;line-height:1.25}
  .phrase .de{color:var(--muted);margin-top:4px}
  .phrase .row{display:flex;gap:10px;margin-top:14px}
  .say{flex:1;min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px}
  .say.primary{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

  /* dialog */
  .scene{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
  .bubbles{display:flex;flex-direction:column;gap:12px}
  .bub{max-width:88%;border:none;text-align:left;padding:14px 18px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);transition:outline-color .2s}
  .bub .who{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .bub .en{font-size:1.12rem;margin-top:2px}
  .bub .de{color:var(--muted);font-size:.9rem;margin-top:4px}
  .bub.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:8px}
  .bub.other{align-self:flex-start;border-bottom-left-radius:8px}
  .bub.playing{outline:3px solid var(--sun)}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}

  /* exercise */
  .progress{height:14px;background:var(--line);border-radius:999px;overflow:hidden;flex:1}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s}
  .ask{font-size:.95rem;font-weight:700;color:var(--muted);margin:8px 4px 10px}
  .prompt{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 22px;margin-bottom:18px}
  .prompt .en{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;line-height:1.25}
  .prompt .de{color:var(--muted);margin-top:6px}
  .prompt .row{display:flex;gap:10px;margin-top:16px}
  .gapword{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--warm);color:var(--warm);text-align:center}
  .bigplay{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
  .bigplay .circle{width:120px;height:120px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:2.6rem;box-shadow:var(--shadow)}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{width:100%;min-height:70px;padding:14px 20px;border-radius:18px;border:2px solid var(--line);background:var(--card);text-align:left;font-size:1.08rem;box-shadow:0 1px 2px rgba(30,38,56,.05)}
  .opt.right{border-color:var(--accent);background:var(--accent-soft)}
  .opt.wrong{border-color:var(--warm);background:var(--warm-soft)}
  .opt:disabled{opacity:1}
  .opt.dim{opacity:.45}

  .answerbox{min-height:96px;background:var(--card);border:2px dashed var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;margin-bottom:16px}
  .bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .chip{min-height:58px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.08rem;box-shadow:0 2px 0 var(--line)}
  .chip.used{visibility:hidden}
  .chip.placed{background:var(--accent-soft);border-color:transparent;box-shadow:none}

  .feedback{position:fixed;left:0;right:0;bottom:0;padding:18px 20px calc(18px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -8px 30px rgba(30,38,56,.12);border-radius:26px 26px 0 0;transform:translateY(110%);transition:transform .3s ease;z-index:10}
  .feedback.show{transform:none}
  .feedback .inner{max-width:740px;margin:0 auto}
  .feedback .head{font-family:"Fraunces",Georgia,serif;font-size:1.4rem;margin-bottom:4px}
  .feedback.ok .head{color:var(--accent)}
  .feedback.no .head{color:var(--warm)}
  .feedback .sol{font-size:1.1rem;margin:4px 0 14px}
  .feedback .sol .de{color:var(--muted);font-size:.92rem}
  .feedback .row{display:flex;gap:12px}
  .feedback .row .say{flex:0 0 auto;padding:0 18px}

  .done{text-align:center;padding-top:30px}
  .done .emoji{font-size:4rem}
  .done h1{margin:10px 0}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .seg.two-c{grid-template-columns:1fr 1fr}
  .seg button{min-height:62px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700}
  .seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  label.field{display:block;font-weight:700;margin-bottom:8px}
  input.text{width:100%;min-height:64px;border-radius:16px;border:2px solid var(--line);padding:0 18px;font:inherit;font-size:1.1rem;background:var(--card);color:var(--ink)}
  input.text:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}

  .toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:16px;z-index:20;transition:transform .3s;max-width:90vw;text-align:center}
  .toast.show{transform:translate(-50%,0)}

  .install{display:flex;gap:16px;align-items:flex-start;background:var(--warm-soft);border-radius:var(--radius);padding:18px 20px;margin:6px 0 18px}
  .install .i{font-size:1.8rem;line-height:1}
  .install p{margin:.25rem 0 0}
  .install .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .install .row button{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid transparent;font-weight:700}
  .install .yes{background:var(--warm);color:#fff}
  .install .later{background:transparent;border-color:rgba(185,83,47,.35)!important;color:var(--warm)}
  .testcard{display:flex;align-items:center;gap:16px;width:100%;border:2px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:16px 20px;text-align:left;margin-bottom:14px;min-height:84px}
  .testcard .big{font-size:1.9rem}.testcard b{font-size:1.05rem}.testcard span{color:var(--muted);font-size:.86rem}.testcard .arrow{font-size:1.8rem;color:var(--accent)}
  .reading{background:var(--card);border-left:6px solid var(--sun);border-radius:16px;padding:18px 20px;margin-bottom:16px;font-size:1.02rem;line-height:1.55;box-shadow:var(--shadow)}
  .opt.dk{background:transparent;border-style:dashed;color:var(--muted);min-height:58px}
  .levelbig{font-family:"Fraunces",Georgia,serif;font-size:4.2rem;line-height:1;color:var(--accent)}
  .lvrow{display:flex;align-items:center;gap:14px;margin:8px 0}.lvrow b{width:34px}.lvrow span{width:44px;text-align:right;color:var(--muted)}

  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn.huge{min-height:88px;font-size:1.35rem;border-radius:24px;box-shadow:0 8px 24px rgba(31,111,92,.28)}
  .iconbtn.gear{min-width:56px;font-size:1.3rem;color:var(--muted);border-color:transparent;background:transparent}
  .todaycard{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:30px 28px;margin:22px 0 22px;text-align:center}
  .todaycard .ico{width:96px;height:96px;margin:0 auto 14px;border-radius:28px;background:var(--accent-soft);display:grid;place-items:center;font-size:2.8rem}
  .todaycard h2{font-size:1.9rem;margin:6px 0 16px}
  .dots{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
  .dots span{width:44px;height:10px;border-radius:999px;background:var(--line)}
  .dots span.past{background:var(--accent)}.dots span.now{background:var(--sun)}
  .phrase.big{padding:30px 26px 22px}.phrase.big .en{font-size:1.8rem}.phrase.big .de{font-size:1.1rem;margin-top:10px}.phrase.big .row{margin-top:22px}
  .stickynext{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(247,243,236,0));z-index:4}
  .stickynext .inner{max-width:740px;margin:0 auto}
  .videobox{position:relative;width:100%;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000}
  .videobox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  a.btn{text-decoration:none}
  .bub .row .say{flex:0 0 auto;min-height:46px;padding:0 16px}
  .toast{opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}
  .toast.show{opacity:1}
  .say.mic{background:var(--warm-soft);border-color:transparent;color:var(--warm)}
  .say.mic.recording,.micbig.recording{background:var(--warm);color:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(185,83,47,.45)}50%{box-shadow:0 0 0 12px rgba(185,83,47,0)}}
  .speakres:empty{display:none}
  .sr-box{display:flex;gap:16px;align-items:center;margin-top:14px;background:var(--bg);border-radius:16px;padding:14px}
  .sr-score{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:#fff}
  .sr-score.good{background:var(--accent)}.sr-score.mid{background:#C9962B}.sr-score.low{background:var(--warm)}
  .sr-words{font-size:1.12rem;margin:6px 0;line-height:1.7}
  .w-ok{color:var(--accent);font-weight:700}.w-unsure{color:#9A6B00;font-weight:700;border-bottom:3px dotted #C9962B}.w-miss{color:var(--warm);font-weight:700;text-decoration:underline wavy}
  .bub.pop{animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bub .de[hidden]{display:none}
  .tipcard{background:linear-gradient(135deg,#FFF6DD,#FDEFD0);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
  .tiphead{font-family:"Fraunces",Georgia,serif;font-size:1.35rem;margin-bottom:8px}
  .tipcard p{margin:0;font-size:1.05rem;line-height:1.55}
  .chatbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -8px 30px rgba(30,38,56,.10);padding:12px 20px calc(14px + env(safe-area-inset-bottom));z-index:5}
  .chatbar .inner{max-width:740px;margin:0 auto}
  .chatbar .row{display:flex;gap:10px}
  .micbig{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:76px;border-radius:22px;border:none;background:var(--accent);color:#fff;font-size:1.7rem;font-weight:700}
  .micbig span{font-size:1.1rem}
  .praise{margin-top:10px;color:var(--accent);font-weight:700;font-size:.95rem}
  .corr{margin-top:10px;background:#FFF8E6;border-radius:14px;padding:10px 14px;border-left:5px solid #C9962B}
  .corr .better{font-weight:700;font-size:1.05rem}
  .sectionhead h2{font-size:1.25rem}
  .welcome{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
  .welcome .flag{font-size:3.4rem}
  @media (max-width:520px){ .two{grid-template-columns:1fr} html{font-size:calc(19px * var(--scale))} }
</style>
</head>
<body>
<div id="app"></div>
<div class="feedback" id="fb"><div class="inner" id="fbInner"></div></div>
<div class="toast" id="toast"></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
