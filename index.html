<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Englisch">
<meta name="theme-color" content="#F7F3EC">
<title>Englisch für unterwegs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  @font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
  @font-face{font-family:"Fraunces";font-weight:500 700;font-style:normal;font-display:swap;src:url(fonts/fraunces-latin-600-normal.woff2) format("woff2")}
  :root{
    --bg:#F7F3EC; --card:#FFFFFF; --ink:#1E2638; --muted:#566074; --line:#E5DED1;
    --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#E2EFE9;
    --warm:#B9532F; --warm-soft:#FBEAE2; --sun:#F2C14E;
    --radius:22px; --shadow:0 1px 2px rgba(30,38,56,.06),0 6px 20px rgba(30,38,56,.07);
    --scale:1;
  }
  *{box-sizing:border-box}
  html{font-size:calc(21px * var(--scale)); -webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",-apple-system,system-ui,sans-serif;line-height:1.45}
  button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
  #app{max-width:780px;margin:0 auto;padding:18px 20px 260px}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
  h1{font-size:1.9rem;line-height:1.15}
  h2{font-size:1.4rem;line-height:1.2}
  h3{font-size:1.15rem}
  .muted{color:var(--muted)}
  .small{font-size:.86rem}

  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;min-height:64px;margin-bottom:10px}
  .bar .title{flex:1;font-weight:700;font-size:1rem;color:var(--muted);text-align:center}
  .iconbtn{min-width:64px;min-height:56px;padding:0 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.95rem}
  .iconbtn:active{transform:scale(.98)}
  .spacer{min-width:64px}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
  .stack>*+*{margin-top:16px}

  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;padding:14px 22px;border-radius:18px;border:none;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
  .btn.secondary{background:var(--card);color:var(--ink);border:2px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent);min-height:56px}
  .btn:disabled{opacity:.4}
  .btn:active:not(:disabled){transform:scale(.99)}

  /* home */
  .hello{padding:8px 4px 6px}
  .hello p{margin:.35rem 0 0;font-size:1.05rem}
  .daily{background:linear-gradient(135deg,#1F6F5C,#2C8A72);color:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .daily .lab{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
  .daily .en{font-family:"Fraunces",Georgia,serif;font-size:1.55rem;line-height:1.2;margin:.4rem 0 .2rem}
  .daily .de{opacity:.9}
  .daily .row{display:flex;gap:10px;margin-top:16px}
  .pill{min-height:56px;padding:0 20px;border-radius:999px;border:none;font-weight:700;background:rgba(255,255,255,.18);color:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:none;text-align:left;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
  .tile .big{font-size:1.7rem}
  .tile b{font-size:1.05rem}
  .tile span{color:var(--muted);font-size:.86rem}
  .sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin:30px 4px 12px}
  .lesson{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:none;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;text-align:left;min-height:92px}
  .lesson+.lesson{margin-top:12px}
  .lesson .ico{flex:none;width:60px;height:60px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.7rem}
  .lesson .txt{flex:1;min-width:0}
  .lesson .txt b{display:block;font-size:1.05rem}
  .lesson .txt span{color:var(--muted);font-size:.86rem}
  .badge{flex:none;font-size:.78rem;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--bg);color:var(--muted)}
  .badge.ok{background:var(--accent-soft);color:var(--accent)}
  .badge.next{background:var(--warm-soft);color:var(--warm)}

  /* lesson hub */
  .hubhead{display:flex;gap:18px;align-items:center}
  .hubhead .ico{width:84px;height:84px;border-radius:24px;background:var(--accent-soft);display:grid;place-items:center;font-size:2.4rem;flex:none}
  .step{display:flex;align-items:center;gap:16px;width:100%;border:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-align:left;min-height:88px}
  .step+.step{margin-top:12px}
  .step .num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
  .step b{display:block}
  .step span{color:var(--muted);font-size:.86rem}

  /* phrase cards */
  .phrase{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 20px 16px}
  .phrase+.phrase{margin-top:14px}
  .phrase .en{font-family:"Fraunces",Georgia,serif;font-size:1.35rem;line-height:1.25}
  .phrase .de{color:var(--muted);margin-top:4px}
  .phrase .row{display:flex;gap:10px;margin-top:14px}
  .say{flex:1;min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px}
  .say.primary{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

  /* dialog */
  .scene{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
  .bubbles{display:flex;flex-direction:column;gap:12px}
  .bub{max-width:88%;border:none;text-align:left;padding:14px 18px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);transition:outline-color .2s}
  .bub .who{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .bub .en{font-size:1.12rem;margin-top:2px}
  .bub .de{color:var(--muted);font-size:.9rem;margin-top:4px}
  .bub.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:8px}
  .bub.other{align-self:flex-start;border-bottom-left-radius:8px}
  .bub.playing{outline:3px solid var(--sun)}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}

  /* exercise */
  .progress{height:14px;background:var(--line);border-radius:999px;overflow:hidden;flex:1}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s}
  .ask{font-size:.95rem;font-weight:700;color:var(--muted);margin:8px 4px 10px}
  .prompt{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 22px;margin-bottom:18px}
  .prompt .en{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;line-height:1.25}
  .prompt .de{color:var(--muted);margin-top:6px}
  .prompt .row{display:flex;gap:10px;margin-top:16px}
  .gapword{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--warm);color:var(--warm);text-align:center}
  .bigplay{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
  .bigplay .circle{width:120px;height:120px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:2.6rem;box-shadow:var(--shadow)}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{width:100%;min-height:70px;padding:14px 20px;border-radius:18px;border:2px solid var(--line);background:var(--card);text-align:left;font-size:1.08rem;box-shadow:0 1px 2px rgba(30,38,56,.05)}
  .opt.right{border-color:var(--accent);background:var(--accent-soft)}
  .opt.wrong{border-color:var(--warm);background:var(--warm-soft)}
  .opt:disabled{opacity:1}
  .opt.dim{opacity:.45}

  .answerbox{min-height:96px;background:var(--card);border:2px dashed var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;margin-bottom:16px}
  .bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .chip{min-height:58px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.08rem;box-shadow:0 2px 0 var(--line)}
  .chip.used{visibility:hidden}
  .chip.placed{background:var(--accent-soft);border-color:transparent;box-shadow:none}

  .feedback{position:fixed;left:0;right:0;bottom:0;padding:18px 20px calc(18px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -8px 30px rgba(30,38,56,.12);border-radius:26px 26px 0 0;transform:translateY(110%);transition:transform .3s ease;z-index:10}
  .feedback.show{transform:none}
  .feedback .inner{max-width:740px;margin:0 auto}
  .feedback .head{font-family:"Fraunces",Georgia,serif;font-size:1.4rem;margin-bottom:4px}
  .feedback.ok .head{color:var(--accent)}
  .feedback.no .head{color:var(--warm)}
  .feedback .sol{font-size:1.1rem;margin:4px 0 14px}
  .feedback .sol .de{color:var(--muted);font-size:.92rem}
  .feedback .row{display:flex;gap:12px}
  .feedback .row .say{flex:0 0 auto;padding:0 18px}

  .done{text-align:center;padding-top:30px}
  .done .emoji{font-size:4rem}
  .done h1{margin:10px 0}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .seg.two-c{grid-template-columns:1fr 1fr}
  .seg button{min-height:62px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700}
  .seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  label.field{display:block;font-weight:700;margin-bottom:8px}
  input.text{width:100%;min-height:64px;border-radius:16px;border:2px solid var(--line);padding:0 18px;font:inherit;font-size:1.1rem;background:var(--card);color:var(--ink)}
  input.text:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}

  .toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:16px;z-index:20;transition:transform .3s;max-width:90vw;text-align:center}
  .toast.show{transform:translate(-50%,0)}

  .install{display:flex;gap:16px;align-items:flex-start;background:var(--warm-soft);border-radius:var(--radius);padding:18px 20px;margin:6px 0 18px}
  .install .i{font-size:1.8rem;line-height:1}
  .install p{margin:.25rem 0 0}
  .install .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .install .row button{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid transparent;font-weight:700}
  .install .yes{background:var(--warm);color:#fff}
  .install .later{background:transparent;border-color:rgba(185,83,47,.35)!important;color:var(--warm)}
  .welcome{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
  .welcome .flag{font-size:3.4rem}
  @media (max-width:520px){ .two{grid-template-columns:1fr} html{font-size:calc(19px * var(--scale))} }
</style>
</head>
<body>
<div id="app"></div>
<div class="feedback" id="fb"><div class="inner" id="fbInner"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   INHALT: 10 Lektionen für Reisen & Alltag (Niveau A1/A2)
   {name} wird durch den eingestellten Vornamen ersetzt.
   ============================================================ */
const LESSONS = [
{ id:'kennenlernen', icon:'👋', title:'Kennenlernen', en:'Getting to know people',
  scene:'Beim Frühstück im Hotel setzt sich eine Engländerin an deinen Tisch.',
  phrases:[
    {en:'Hello, my name is {name}.', de:'Hallo, ich heiße {name}.'},
    {en:'Nice to meet you.', de:'Schön, Sie kennenzulernen.'},
    {en:"I'm from Germany.", de:'Ich komme aus Deutschland.'},
    {en:'Where are you from?', de:'Woher kommen Sie?'},

    {en:'I live in a small town.', de:'Ich wohne in einer kleinen Stadt.'},
    {en:'My English is not very good.', de:'Mein Englisch ist nicht sehr gut.'},
    {en:'Could you speak more slowly, please?', de:'Könnten Sie bitte langsamer sprechen?'}],
  dialog:[
    {who:'Mary', en:'Good morning! Is this seat free?', de:'Guten Morgen! Ist dieser Platz frei?'},
    {who:'me', en:'Yes, of course. Please sit down.', de:'Ja, natürlich. Bitte setzen Sie sich.'},
    {who:'Mary', en:"Thank you. I'm Mary. Where are you from?", de:'Danke. Ich bin Mary. Woher kommen Sie?'},
    {who:'me', en:"I'm from Germany. My name is {name}.", de:'Ich komme aus Deutschland. Ich heiße {name}.'},
    {who:'Mary', en:'Nice to meet you! Are you here on holiday?', de:'Schön, Sie kennenzulernen! Sind Sie im Urlaub hier?'},
    {who:'me', en:'Yes, for one week. My English is not very good.', de:'Ja, für eine Woche. Mein Englisch ist nicht sehr gut.'},
    {who:'Mary', en:"Don't worry. Your English is fine!", de:'Keine Sorge. Ihr Englisch ist gut!'}],
  gaps:[
    {en:'Nice to ___ you.', de:'Schön, Sie kennenzulernen.', answer:'meet', wrong:['see','know']},
    {en:"I'm ___ Germany.", de:'Ich komme aus Deutschland.', answer:'from', wrong:['in','to']}],
  replies:[
    {q:'Where are you from?', qde:'Woher kommen Sie?', a:"I'm from Germany.", wrong:["I'm fine, thank you.","It's ten o'clock."]},
    {q:'Nice to meet you.', qde:'Schön, Sie kennenzulernen.', a:'Nice to meet you, too.', wrong:['Yes, please.','Turn left.']}]
},
{ id:'flughafen', icon:'✈️', title:'Am Flughafen', en:'At the airport',
  scene:'Du stehst am Check-in-Schalter.',
  phrases:[
    {en:'Where is the check-in, please?', de:'Wo ist bitte der Check-in?'},
    {en:'Here is my passport.', de:'Hier ist mein Reisepass.'},
    {en:'I have one suitcase.', de:'Ich habe einen Koffer.'},
    {en:'Can I have a window seat?', de:'Kann ich einen Fensterplatz haben?'},
    {en:'Which gate is it?', de:'Welches Gate ist es?'},
    {en:'Is the flight on time?', de:'Ist der Flug pünktlich?'},
    {en:'The flight is delayed.', de:'Der Flug hat Verspätung.'},
    {en:'Where is the baggage claim?', de:'Wo ist die Gepäckausgabe?'}],
  dialog:[
    {who:'Schalter', en:'Good morning. Your passport, please.', de:'Guten Morgen. Ihren Reisepass, bitte.'},
    {who:'me', en:'Here is my passport.', de:'Hier ist mein Reisepass.'},
    {who:'Schalter', en:'Thank you. How many bags do you have?', de:'Danke. Wie viele Gepäckstücke haben Sie?'},
    {who:'me', en:'I have one suitcase. Can I have a window seat?', de:'Ich habe einen Koffer. Kann ich einen Fensterplatz haben?'},
    {who:'Schalter', en:'Yes, of course. Seat fourteen A.', de:'Ja, natürlich. Platz 14A.'},
    {who:'me', en:'Thank you. Which gate is it?', de:'Danke. Welches Gate ist es?'},
    {who:'Schalter', en:'Gate twenty-two. Boarding is at ten thirty.', de:'Gate 22. Einsteigen ist um halb elf.'}],
  gaps:[
    {en:'Can I have a ___ seat?', de:'Kann ich einen Fensterplatz haben?', answer:'window', wrong:['door','table']},
    {en:'The flight is ___.', de:'Der Flug hat Verspätung.', answer:'delayed', wrong:['hungry','expensive']}],
  replies:[
    {q:'How many bags do you have?', qde:'Wie viele Gepäckstücke haben Sie?', a:'I have one suitcase.', wrong:["I'm from Germany.",'A coffee, please.']},
    {q:'Your passport, please.', qde:'Ihren Reisepass, bitte.', a:'Here you are.', wrong:['Nice to meet you, too.',"I'm sorry, it's closed."]}]
},
{ id:'hotel', icon:'🏨', title:'Im Hotel', en:'At the hotel',
  scene:'Du kommst abends an der Hotelrezeption an.',
  phrases:[
    {en:'I have a reservation.', de:'Ich habe eine Reservierung.'},
    {en:'For three nights.', de:'Für drei Nächte.'},
    {en:'What time is breakfast?', de:'Wann gibt es Frühstück?'},
    {en:'Can I have the key, please?', de:'Kann ich bitte den Schlüssel haben?'},
    {en:'What is the Wi-Fi password?', de:'Wie ist das WLAN-Passwort?'},
    {en:"The shower doesn't work.", de:'Die Dusche funktioniert nicht.'},
    {en:'Could I have another towel?', de:'Könnte ich noch ein Handtuch haben?'},
    {en:'I would like to check out.', de:'Ich möchte auschecken.'}],
  dialog:[
    {who:'Rezeption', en:'Good evening. How can I help you?', de:'Guten Abend. Wie kann ich Ihnen helfen?'},
    {who:'me', en:'Good evening. I have a reservation.', de:'Guten Abend. Ich habe eine Reservierung.'},
    {who:'Rezeption', en:'What is your name, please?', de:'Wie ist Ihr Name, bitte?'},
    {who:'me', en:'My name is {name}. For three nights.', de:'Ich heiße {name}. Für drei Nächte.'},
    {who:'Rezeption', en:'Thank you. Your room is two-o-five. Here is your key.', de:'Danke. Ihr Zimmer ist die 205. Hier ist Ihr Schlüssel.'},
    {who:'me', en:'What time is breakfast?', de:'Wann gibt es Frühstück?'},
    {who:'Rezeption', en:'From seven to ten, in the restaurant.', de:'Von sieben bis zehn, im Restaurant.'},
    {who:'me', en:'Thank you very much.', de:'Vielen Dank.'}],
  gaps:[
    {en:"The shower doesn't ___.", de:'Die Dusche funktioniert nicht.', answer:'work', wrong:['sleep','eat']},
    {en:'Could I have another ___?', de:'Könnte ich noch ein Handtuch haben?', answer:'towel', wrong:['train','ticket']}],
  replies:[
    {q:'How can I help you?', qde:'Wie kann ich Ihnen helfen?', a:'I have a reservation.', wrong:["Yes, it's delayed.",'Nice to meet you, too.']},
    {q:'What is your name, please?', qde:'Wie ist Ihr Name, bitte?', a:'My name is {name}.', wrong:["I'm fine, thanks.",'From seven to ten.']}]
},
{ id:'restaurant', icon:'☕', title:'Café & Restaurant', en:'At the restaurant',
  scene:'Du gehst mit einer Freundin essen.',
  phrases:[
    {en:'A table for two, please.', de:'Einen Tisch für zwei, bitte.'},
    {en:'Can I see the menu, please?', de:'Kann ich bitte die Speisekarte sehen?'},
    {en:'I would like a coffee with milk.', de:'Ich hätte gern einen Kaffee mit Milch.'},
    {en:'What do you recommend?', de:'Was empfehlen Sie?'},
    {en:"I'll have the fish, please.", de:'Ich nehme den Fisch, bitte.'},
    {en:'A glass of water, please.', de:'Ein Glas Wasser, bitte.'},
    {en:'It was delicious!', de:'Es war köstlich!'},
    {en:'Could I have the bill, please?', de:'Könnte ich bitte die Rechnung haben?'}],
  dialog:[
    {who:'Kellner', en:'Good evening! A table for two?', de:'Guten Abend! Einen Tisch für zwei?'},
    {who:'me', en:'Yes, please. Can we see the menu?', de:'Ja, bitte. Können wir die Speisekarte sehen?'},
    {who:'Kellner', en:'Of course. Here you are.', de:'Natürlich. Bitte schön.'},
    {who:'me', en:'What do you recommend?', de:'Was empfehlen Sie?'},
    {who:'Kellner', en:'The fish is very good today.', de:'Der Fisch ist heute sehr gut.'},
    {who:'me', en:"Then I'll have the fish, please. And a glass of water.", de:'Dann nehme ich den Fisch, bitte. Und ein Glas Wasser.'},
    {who:'Kellner', en:'Very good. Anything else?', de:'Sehr gut. Sonst noch etwas?'},
    {who:'me', en:"No, thank you. That's all.", de:'Nein, danke. Das ist alles.'}],
  gaps:[
    {en:'Could I have the ___, please?', de:'Könnte ich bitte die Rechnung haben?', answer:'bill', wrong:['key','gate']},
    {en:'A ___ of water, please.', de:'Ein Glas Wasser, bitte.', answer:'glass', wrong:['bag','box']}],
  replies:[
    {q:'Anything else?', qde:'Sonst noch etwas?', a:"No, thank you. That's all.", wrong:['Gate twenty-two.',"I'm from Germany."]},
    {q:'How was your meal?', qde:'Wie war Ihr Essen?', a:'It was delicious!', wrong:['A table for two.',"It's delayed."]}]
},
{ id:'weg', icon:'🗺️', title:'Nach dem Weg fragen', en:'Asking the way',
  scene:'Du suchst in einer fremden Stadt das Museum.',
  phrases:[
    {en:'Excuse me, can you help me?', de:'Entschuldigung, können Sie mir helfen?'},
    {en:'Where is the train station?', de:'Wo ist der Bahnhof?'},
    {en:'Is it far from here?', de:'Ist es weit von hier?'},
    {en:'Go straight on.', de:'Gehen Sie geradeaus.'},
    {en:'Turn left.', de:'Biegen Sie links ab.'},
    {en:'Turn right.', de:'Biegen Sie rechts ab.'},
    {en:"It's next to the bank.", de:'Es ist neben der Bank.'},
    {en:"I'm lost.", de:'Ich habe mich verlaufen.'}],
  dialog:[
    {who:'me', en:'Excuse me, can you help me?', de:'Entschuldigung, können Sie mir helfen?'},
    {who:'Passant', en:'Yes, of course.', de:'Ja, natürlich.'},

/* ============================================================
   ZUSTAND (wird nur auf diesem Gerät gespeichert)
   ============================================================ */
const KEY = 'englisch-unterwegs-v1';
let state = { name:'', done:{}, miss:{}, scale:1, rate:0.9, accent:'en-GB', showDe:true, onboarded:false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = Object.assign(state, s); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
function applyScale(){ document.documentElement.style.setProperty('--scale', state.scale); }
applyScale();

const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm = () => (state.name || '').trim() || 'Maria';
const N = s => String(s).split('{name}').join(nm());
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const byId = id => LESSONS.find(l => l.id === id);

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }

/* ============================================================
   SPRACHAUSGABE (Stimmen des iPads)
   ============================================================ */
const hasTTS = 'speechSynthesis' in window;
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch(e){ voices=[]; } }
if (hasTTS){ loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch(e){} }
function pickVoices(){
  if (!voices.length) loadVoices();
  const want = state.accent.toLowerCase();
  const lang = v => v.lang.replace('_','-').toLowerCase();
  let pool = voices.filter(v => lang(v) === want);
  if (!pool.length) pool = voices.slice();
  const score = v => (v.localService?4:0) + (/premium|enhanced|natural|neural/i.test(v.name)?3:0) + (/daniel|kate|serena|samantha|alex|arthur|martha/i.test(v.name)?1:0);
  pool.sort((a,b) => score(b)-score(a));
  const main = pool[0] || null;
  const other = pool.find(v => v !== main) || voices.find(v => v !== main) || main;
  return [main, other];
}
let speakToken = 0;
function speak(text, opts={}){
  if (!hasTTS){ toast('Dieses Gerät hat leider keine Sprachausgabe.'); return Promise.resolve(); }
  return new Promise(res => {
    let finished = false; const done = () => { if(!finished){ finished=true; res(); } };
    try {
      if (!opts.keep) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(N(text));
      const [main, other] = pickVoices();
      const v = opts.other ? other : main;
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = state.accent;
      u.rate = opts.slow ? 0.6 : state.rate;
      if (opts.other && other === main) u.pitch = 1.25;
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
      setTimeout(done, 4000 + N(text).length * 160);
    } catch(e){ done(); }
  });
}
function stopSpeech(){ speakToken++; if (hasTTS) try{ speechSynthesis.cancel(); }catch(e){} }

/* ============================================================
   NAVIGATION
   ============================================================ */
let view = { name:'home' };
function go(v){ stopSpeech(); hideFb(); view = v; render(); window.scrollTo(0,0); }

function bar(title, back='home', right=''){
  return `<div class="bar">
    <button class="iconbtn" data-go="${back}" aria-label="Zurück">‹ Zurück</button>
    <div class="title">${esc(title)}</div>
    ${right || '<div class="spacer"></div>'}
  </div>`;
}

function render(){
  if (!state.onboarded) return renderWelcome();
  ({home:renderHome, hub:renderHub, phrases:renderPhrases, dialog:renderDialog, ex:renderEx, done:renderDone, settings:renderSettings}[view.name] || renderHome)();
}

/* ---------- Willkommen ---------- */
function renderWelcome(){
  $app.innerHTML = `<div class="welcome stack">
    <div class="flag">🇬🇧</div>
    <h1>Willkommen bei<br>„Englisch für unterwegs“</h1>
    <p class="muted" style="font-size:1.05rem">Kurze Lektionen für Reisen und Alltag – in Ruhe, ohne Druck. Alles wird vorgelesen, so oft du willst.</p>
    <div>
      <label class="field" for="nameIn">Wie heißt du mit Vornamen?</label>
      <input id="nameIn" class="text" type="text" autocomplete="given-name" placeholder="z. B. Maria" value="${esc(state.name)}">
      <p class="muted small" style="margin:.5rem 0 0">Der Name kommt in den Übungssätzen vor („My name is …“).</p>
    </div>
    <button class="btn" id="startBtn">Los geht’s</button>
  </div>`;
  document.getElementById('startBtn').onclick = () => {
    state.name = document.getElementById('nameIn').value.trim();
    state.onboarded = true; save();
    if (hasTTS) speak('Hello, ' + nm() + '! Welcome!');
    go({name:'home'});
  };
}

/* ---------- Installation & Offline ---------- */
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installEvent = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; if (view.name==='home' && state.onboarded) render(); });
window.addEventListener('appinstalled', () => { installEvent = null; state.installHidden = true; save(); toast('Fertig! Die App ist jetzt installiert.'); if (view.name==='home') render(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(()=>{}); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

function installHow(){
  if (installEvent) return 'Mit einem Tipp legst du die App auf deinen Computer. Danach funktioniert sie auch ohne Internet.';
  if (isIOS()) return 'Tippe in Safari auf <b>Teilen</b> (das Quadrat mit dem Pfeil nach oben) und dann auf <b>„Zum Home-Bildschirm“</b>. Danach startet „Englisch“ wie jede andere App – auch ohne Internet.';
  return 'Im Browser oben rechts im Menü <b>„App installieren“</b> bzw. <b>„Als App installieren“</b> wählen. Danach funktioniert die App auch ohne Internet.';
}
function installBanner(){
  if (isStandalone() || state.installHidden || location.protocol === 'file:') return '';
  return `<div class="install"><div class="i">📲</div><div style="flex:1">
    <b>Als App speichern</b><p>${installHow()}</p>
    <div class="row">${installEvent ? '<button class="yes" data-act="install">Jetzt installieren</button>' : ''}<button class="later" data-act="hideinstall">${installEvent ? 'Später' : 'Verstanden'}</button></div>
  </div></div>`;
}

/* ---------- Startseite ---------- */
function allPhrases(){ return LESSONS.flatMap(l => l.phrases.map(p => ({...p, lesson:l.id}))); }
function dailyPhrase(){ const all = allPhrases(); const d = Math.floor(Date.now()/86400000); return all[(d*7) % all.length]; }
function greeting(){ const h = new Date().getHours(); return h<11 ? 'Guten Morgen' : h<18 ? 'Guten Tag' : 'Guten Abend'; }

function renderHome(){
  const dp = dailyPhrase();
  const doneCount = LESSONS.filter(l => state.done[l.id]).length;
  const next = LESSONS.find(l => !state.done[l.id]);
  $app.innerHTML = `
    <div class="bar"><div class="spacer"></div><div class="title"></div><button class="iconbtn" data-go="settings" aria-label="Einstellungen">⚙︎ Einstellungen</button></div>

    </div>
    <div style="height:12px"></div>${installBanner()}
    <div class="daily">
      <div class="lab">Satz des Tages</div>

    </div>
    <div class="two" style="margin-top:14px">
      <button class="tile" data-act="${next ? 'open:'+next.id : 'review'}">
        <div class="big">${next ? next.icon : '🌟'}</div>
        <div><b>${next ? 'Weiterlernen' : 'Alles geschafft!'}</b><br><span>${next ? esc('Lektion '+(LESSONS.indexOf(next)+1)+': '+next.title) : 'Jetzt mit Kopftraining wiederholen'}</span></div>
      </button>
      <button class="tile" data-act="review">
        <div class="big">🧠</div>
        <div><b>Kopftraining</b><br><span>${doneCount ? 'Gelerntes wiederholen – 8 kurze Aufgaben' : 'Nach der ersten Lektion verfügbar'}</span></div>
      </button>
    </div>
    <div class="sectionhead"><h2>Lektionen</h2><span class="muted small">je ca. 10 Minuten</span></div>
    ${LESSONS.map((l,i) => {
      const n = state.done[l.id] || 0;
      const badge = n ? `<span class="badge ok">✓ ${n}× geübt</span>` : (next && next.id===l.id ? '<span class="badge next">Als Nächstes</span>' : '<span class="badge">Neu</span>');
      return `<button class="lesson" data-act="open:${l.id}">
        <div class="ico">${l.icon}</div>
        <div class="txt"><b>${i+1}. ${esc(l.title)}</b><span>${esc(l.en)}</span></div>${badge}</button>`;
    }).join('')}
  `;
}

    <div class="scene"><b>Die Situation:</b> ${esc(L.scene)}</div>
    <div class="controls">
      <button class="btn" id="playAll">▶︎ Ganzes Gespräch</button>
      <button class="btn secondary" id="toggleDe">${state.showDe ? 'Deutsch ausblenden' : 'Deutsch zeigen'}</button>
    </div>
    <p class="muted small" style="margin:0 4px 14px">Tipp: Tippe auf eine Sprechblase, um nur diesen Satz zu hören. Deine Sätze stehen rechts in Grün.</p>
    <div class="bubbles">
      ${L.dialog.map((d,k) => `<button class="bub ${d.who==='me'?'me':'other'}" data-line="${k}">
        <div class="who">${d.who==='me' ? 'Du' : esc(d.who)}</div>
        <div class="en">${esc(N(d.en))}</div>
        ${state.showDe ? `<div class="de">${esc(N(d.de))}</div>` : ''}
      </button>`).join('')}
    </div>
    <div style="margin-top:24px"><button class="btn" data-go-to="ex">Weiter zum Üben ›</button></div>
  `;
  const bubs = [...$app.querySelectorAll('.bub')];
  const mark = k => bubs.forEach((b,j) => b.classList.toggle('playing', j===k));
  bubs.forEach((b,k) => b.onclick = async () => {
    stopSpeech(); const t = speakToken; mark(k);
    await speak(L.dialog[k].en, {other: L.dialog[k].who!=='me'});
    if (t === speakToken) mark(-1);
  });
  document.getElementById('toggleDe').onclick = () => { state.showDe = !state.showDe; save(); stopSpeech(); renderDialog(); };
  document.getElementById('playAll').onclick = async () => {
    stopSpeech(); const t = speakToken;
    for (let k=0; k<L.dialog.length; k++){
      if (t !== speakToken) return;
      mark(k); bubs[k].scrollIntoView({block:'center', behavior:'smooth'});
      await speak(L.dialog[k].en, {other: L.dialog[k].who!=='me', keep:true});
      await new Promise(r => setTimeout(r, 450));
    }
    if (t === speakToken) mark(-1);
  };
}

/* ============================================================
   ÜBUNGEN
   ============================================================ */
const words = s => N(s).trim().split(/\s+/);
function options(correct, pool, n=2){ const others = shuffle([...new Set(pool)].filter(x => x !== correct)).slice(0,n); return shuffle([correct, ...others]); }
const mk = {
  meaning:(p,pool)=>({type:'meaning', key:p.en, en:p.en, de:p.de, answer:p.de, options:options(p.de, pool.map(x=>x.de))}),
  listen:(p,pool)=>({type:'listen', key:p.en, en:p.en, de:p.de, answer:p.en, options:options(p.en, pool.map(x=>x.en))}),
  deen:(p,pool)=>({type:'deen', key:p.en, en:p.en, de:p.de, answer:p.en, options:options(p.en, pool.map(x=>x.en))}),
  order:(p)=>({type:'order', key:p.en, en:p.en, de:p.de}),
  recall:(p)=>({type:'recall', key:p.en, en:p.en, de:p.de}),
  gap:(g)=>({type:'gap', key:g.en, en:g.en, full:g.en.replace('___', g.answer), de:g.de, answer:g.answer, options:shuffle([g.answer, ...g.wrong])}),
  reply:(r)=>({type:'reply', key:r.q, q:r.q, qde:r.qde, en:r.a, answer:r.a, options:shuffle([r.a, ...r.wrong])})
};
const orderable = p => { const n = words(p.en).length; return n>=3 && n<=8; };

function buildLesson(L){
  const ph = shuffle(L.phrases.slice());
  const ord = shuffle(L.phrases.filter(orderable)).slice(0,2);
  const P = L.phrases;
  return [
    mk.meaning(ph[0],P), mk.listen(ph[1],P), mk.gap(L.gaps[0]), mk.reply(L.replies[0]),
    mk.order(ord[0]||ph[2]), mk.meaning(ph[3],P), mk.deen(ph[4],P), mk.listen(ph[5],P),
    mk.gap(L.gaps[1]), mk.reply(L.replies[1]), mk.order(ord[1]||ph[6])
  ];
}
function buildReview(){
  const ls = LESSONS.filter(l => state.done[l.id]);
  const pool = ls.flatMap(l => l.phrases);
  // Sätze mit Fehlern kommen häufiger dran
  const weighted = pool.flatMap(p => Array(1 + Math.min(4, (state.miss[p.en]||0)*2)).fill(p));
  const picked = []; const seen = new Set();
  for (const p of shuffle(weighted)){ if (!seen.has(p.en)){ seen.add(p.en); picked.push(p); } if (picked.length>=8) break; }
  const types = ['recall','meaning','listen','deen','order','recall','listen','meaning'];
  const ex = picked.map((p,i) => { const t = types[i % types.length]; return t==='order' && !orderable(p) ? mk.recall(p) : (mk[t].length>1 ? mk[t](p,pool) : mk[t](p)); });
  // dazu eine Antwort-Aufgabe aus den gelernten Lektionen
  const r = shuffle(ls.flatMap(l => l.replies))[0]; if (r) ex.splice(3,0,mk.reply(r));
  return ex;
}

let run = null;
function startLesson(id){ const L = byId(id); run = {mode:'lesson', id, queue: buildLesson(L), i:0, firstTry:0, total:11, retried:new Set()}; go({name:'ex', id}); }
function startReview(){
  if (!LESSONS.some(l => state.done[l.id])){ toast('Mach zuerst eine Lektion – dann gibt es hier etwas zu wiederholen.'); return; }
  const q = buildReview(); run = {mode:'review', queue:q, i:0, firstTry:0, total:q.length, retried:new Set()}; go({name:'ex'});
}

const ASK = {
  meaning:'Was bedeutet dieser Satz?', listen:'Hör zu. Welchen Satz hörst du?', deen:'Wie sagt man das auf Englisch?',
  order:'Bring die Wörter in die richtige Reihenfolge.', gap:'Welches Wort fehlt?', reply:'Was antwortest du?', recall:'Kannst du es auf Englisch sagen? Sprich es laut aus.'
};

function renderEx(){
  if (!run) return go({name:'home'});
  const e = run.queue[run.i];
  const pct = Math.round(run.i / run.queue.length * 100);
  const back = run.mode==='lesson' ? 'hub:'+run.id : 'home';
  let body = '';
  if (e.type==='meaning'){
    body = `<div class="prompt"><div class="en">${esc(N(e.en))}</div><div class="row"><button class="say primary" data-say="${esc(e.en)}">🔊 Anhören</button><button class="say" data-say-slow="${esc(e.en)}">🐢 Langsam</button></div></div>` + optsHtml(e);
  } else if (e.type==='listen'){
    body = `<div class="bigplay"><button class="circle" data-say="${esc(e.en)}" aria-label="Anhören">🔊</button><button class="say" style="flex:none;padding:0 22px" data-say-slow="${esc(e.en)}">🐢 Langsam anhören</button></div><div style="height:12px"></div>` + optsHtml(e);
  } else if (e.type==='deen'){
    body = `<div class="prompt"><div class="en">${esc(N(e.de))}</div></div>` + optsHtml(e);
  } else if (e.type==='gap'){
    body = `<div class="prompt"><div class="en">${esc(N(e.en)).replace('___','<span class="gapword">?</span>')}</div><div class="de">${esc(N(e.de))}</div></div>` + optsHtml(e);
  } else if (e.type==='reply'){
    body = `<div class="prompt"><div class="muted small" style="font-weight:700">Jemand sagt zu dir:</div><div class="en">„${esc(N(e.q))}“</div><div class="de">${esc(N(e.qde))}</div><div class="row"><button class="say primary" data-say="${esc(e.q)}" data-other="1">🔊 Anhören</button></div></div>` + optsHtml(e);
  } else if (e.type==='order'){
    if (!e.bank){ const w = words(e.en); let s; do { s = shuffle(w.map((t,k)=>({t,k}))); } while (w.length>1 && s.every((x,k)=>x.k===k)); e.bank = s; }
    e.placed = [];
    body = `<div class="prompt" style="padding:18px 22px"><div class="de" style="margin:0;font-size:1.1rem;color:var(--ink)">${esc(N(e.de))}</div></div>
      <div class="answerbox" id="abox"></div><div class="bank" id="bank">${e.bank.map((x,j)=>`<button class="chip" data-chip="${j}">${esc(x.t)}</button>`).join('')}</div>
      <div class="two"><button class="btn secondary" id="clearBtn">Neu anfangen</button><button class="btn" id="checkBtn" disabled>Prüfen</button></div>`;
  } else if (e.type==='recall'){
    body = `<div class="prompt"><div class="en">${esc(N(e.de))}</div></div><div id="recallArea"><button class="btn" id="revealBtn">Lösung zeigen</button></div>`;
  }
  $app.innerHTML = `<div class="bar"><button class="iconbtn" data-go="${back}" aria-label="Beenden">✕</button><div class="progress"><i style="width:${pct}%"></i></div></div>
    <div class="ask">${ASK[e.type]}</div>${body}`;

  if (e.type==='listen') setTimeout(()=>speak(e.en), 250);
  if (e.type==='order') bindOrder(e);
  if (e.type==='recall') document.getElementById('revealBtn').onclick = () => {
    speak(e.en);
    document.getElementById('recallArea').innerHTML = `<div class="prompt"><div class="en">${esc(N(e.en))}</div><div class="row"><button class="say primary" data-say="${esc(e.en)}">🔊 Nochmal</button><button class="say" data-say-slow="${esc(e.en)}">🐢 Langsam</button></div></div>
      <p class="muted" style="margin:0 4px 12px">Hattest du es gewusst?</p>
      <div class="two"><button class="btn secondary" id="noBtn">Noch nicht ganz</button><button class="btn" id="yesBtn">Ja, gewusst! 👍</button></div>`;
    document.getElementById('yesBtn').onclick = () => answer(true, e, {silent:true});
    document.getElementById('noBtn').onclick = () => answer(false, e, {silent:true});
  };
  $app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (e.answered) return;
    const ok = b.dataset.val === e.answer;
    $app.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (o.dataset.val===e.answer) o.classList.add('right'); else if (o!==b) o.classList.add('dim'); });
    if (!ok) b.classList.add('wrong');
    answer(ok, e);
  });
}
function optsHtml(e){ return `<div class="opts">${e.options.map(o => `<button class="opt" data-val="${esc(o)}">${esc(N(o))}</button>`).join('')}</div>`; }

function bindOrder(e){
  const abox = document.getElementById('abox'), bank = document.getElementById('bank'), check = document.getElementById('checkBtn');
  const draw = () => {
    abox.innerHTML = e.placed.map((j,pos) => `<button class="chip placed" data-pos="${pos}">${esc(e.bank[j].t)}</button>`).join('') || '<span class="muted small" style="padding:14px 8px">Tippe die Wörter unten der Reihe nach an …</span>';
    bank.querySelectorAll('.chip').forEach(c => c.classList.toggle('used', e.placed.includes(+c.dataset.chip)));
    check.disabled = e.placed.length !== e.bank.length;
    abox.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (e.answered) return; e.placed.splice(+c.dataset.pos,1); draw(); });
  };
  bank.querySelectorAll('.chip').forEach(c => c.onclick = () => { if (e.answered) return; const j=+c.dataset.chip; if (!e.placed.includes(j)){ e.placed.push(j); draw(); } });
  document.getElementById('clearBtn').onclick = () => { if (e.answered) return; e.placed = []; draw(); };
  check.onclick = () => {
    if (e.answered) return;
    const said = e.placed.map(j => e.bank[j].t).join(' ');
    const ok = said === words(e.en).join(' ');
    abox.style.borderColor = ok ? 'var(--accent)' : 'var(--warm)'; abox.style.borderStyle = 'solid';
    answer(ok, e);
  };
  draw();
}

const PRAISE = ['Richtig! 👏','Sehr gut!','Genau so!','Prima!','Wunderbar!','Stimmt!'];
const COMFORT = ['Fast! So heißt es richtig:','Kein Problem – so ist es richtig:','Nicht schlimm. Richtig ist:'];
const pickOne = a => a[Math.floor(Math.random()*a.length)];

function answer(ok, e, o={}){
  e.answered = true;
  if (ok){ if (!run.retried.has(e.key)) run.firstTry++; state.miss[e.key] = Math.max(0,(state.miss[e.key]||0)-1); }
  else {
    state.miss[e.key] = (state.miss[e.key]||0)+1;
    if (!run.retried.has(e.key)){ run.retried.add(e.key); const copy = {...e, answered:false, bank:null}; if (copy.options) copy.options = shuffle(copy.options.slice()); run.queue.push(copy); }
  }
  save();
  const solEn = e.type==='gap' ? e.full : e.en;
  const solDe = e.type==='reply' ? '' : e.de;
  if (!o.silent) speak(solEn);
  const fb = document.getElementById('fb');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  document.getElementById('fbInner').innerHTML = `
    <div class="head">${ok ? pickOne(PRAISE) : (o.silent ? 'Macht nichts – das kommt gleich noch einmal.' : pickOne(COMFORT))}</div>
    ${(!ok && !o.silent) || ok ? `<div class="sol">${esc(N(solEn))}${solDe ? `<div class="de">${esc(N(solDe))}</div>` : ''}</div>` : '<div style="height:10px"></div>'}
    ${!ok && !o.silent ? '<p class="muted small" style="margin:-6px 0 12px">Diese Aufgabe kommt am Ende noch einmal.</p>' : ''}
    <div class="row"><button class="say" data-say="${esc(solEn)}">🔊</button><button class="btn" id="nextBtn">Weiter ›</button></div>`;
  document.getElementById('nextBtn').onclick = next;
}
function hideFb(){ const fb=document.getElementById('fb'); fb.className='feedback'; }
function next(){
  hideFb(); stopSpeech();
  run.i++;
  if (run.i >= run.queue.length){
    if (run.mode==='lesson'){ state.done[run.id] = (state.done[run.id]||0)+1; save(); }
    return go({name:'done'});
  }
  renderEx(); window.scrollTo(0,0);
}

/* ---------- Geschafft ---------- */
function renderDone(){
  const L = run.mode==='lesson' ? byId(run.id) : null;
  const nextL = L ? LESSONS[LESSONS.indexOf(L)+1] : null;
  const ratio = run.firstTry / run.total;
  const msg = ratio >= .9 ? 'Ausgezeichnet – fast alles auf Anhieb richtig!' : ratio >= .6 ? 'Sehr ordentlich! Mit jeder Wiederholung wird es leichter.' : 'Gut gemacht, dass du drangeblieben bist. Morgen sitzt es schon besser.';
  $app.innerHTML = `<div class="done stack">
    <div class="emoji">${ratio>=.9 ? '🌟' : '🎉'}</div>
    <h1>${L ? 'Lektion geschafft!' : 'Kopftraining geschafft!'}</h1>
    <p style="font-size:1.1rem">${run.firstTry} von ${run.total} Aufgaben auf Anhieb richtig.</p>
    <p class="muted">${msg}</p>
    <div class="stack" style="margin-top:26px;text-align:left">
      ${nextL ? `<button class="btn" data-act="open:${nextL.id}">Nächste Lektion: ${esc(nextL.title)} ›</button>` : ''}
      ${L ? `<button class="btn secondary" data-act="again">Diese Lektion nochmal üben</button>` : `<button class="btn" data-act="review">Noch eine Runde</button>`}
      <button class="btn ghost" data-go="home">Zur Übersicht</button>
    </div></div>`;
}

/* ---------- Einstellungen ---------- */
function renderSettings(){
  const seg = (key, opts) => `<div class="seg ${opts.length===2?'two-c':''}">${opts.map(([v,l]) => `<button data-set="${key}" data-v="${v}" class="${String(state[key])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
  const voiceInfo = !hasTTS ? 'Auf diesem Gerät gibt es keine Sprachausgabe.' : (pickVoices()[0] ? 'Stimme: ' + pickVoices()[0].name + '.' : 'Es wurde noch keine englische Stimme gefunden.');
  $app.innerHTML = bar('Einstellungen') + `<div class="stack">
    <div class="card stack">
      <label class="field" for="nameIn">Dein Vorname</label>
      <input id="nameIn" class="text" type="text" value="${esc(state.name)}" placeholder="z. B. Maria">
    </div>
    <div class="card stack"><h3>Schriftgröße</h3>${seg('scale',[[1,'Normal'],[1.15,'Groß'],[1.3,'Sehr groß']])}</div>
    <div class="card stack"><h3>Sprechtempo</h3>${seg('rate',[[0.75,'Langsam'],[0.9,'Normal'],[1,'Zügig']])}</div>
    <div class="card stack"><h3>Aussprache</h3>${seg('accent',[['en-GB','Britisch 🇬🇧'],['en-US','Amerikanisch 🇺🇸']])}
      <button class="btn secondary" data-say="Hello! How are you today?">🔊 Stimme testen</button>
      <p class="muted small" style="margin:0">${esc(voiceInfo)} Schönere Stimmen gibt es auf dem iPad unter Einstellungen › Bedienungshilfen › Gesprochene Inhalte › Stimmen › Englisch (z. B. „Daniel – Erweitert“ laden).</p>
    </div>
    <div class="card stack"><h3>App & Offline</h3>
      <p style="margin:0">${isStandalone() ? '✓ Die App ist installiert und funktioniert auch ohne Internet.' : installHow()}</p>
      ${!isStandalone() && installEvent ? '<button class="btn" data-act="install">Jetzt installieren</button>' : ''}
      <p class="muted small" style="margin:0">Dein Lernstand wird nur auf diesem Gerät gespeichert.</p></div>
    <div class="card stack"><h3>Fortschritt</h3>
      <div id="resetArea"><button class="btn secondary" id="resetBtn">Fortschritt zurücksetzen</button></div></div>
  </div>`;
  const nameIn = document.getElementById('nameIn');
  nameIn.onchange = nameIn.onblur = () => { state.name = nameIn.value.trim(); save(); };
  $app.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
    const k=b.dataset.set, v=b.dataset.v; state[k] = (k==='accent') ? v : parseFloat(v); save(); applyScale();
    renderSettings(); if (k!=='scale') speak('This is how I sound.');
  });
  document.getElementById('resetBtn').onclick = () => {
    document.getElementById('resetArea').innerHTML = `<p style="margin:0 0 12px">Wirklich alles zurücksetzen? Die geschafften Lektionen werden gelöscht.</p>
      <div class="two"><button class="btn secondary" id="rNo">Abbrechen</button><button class="btn" style="background:var(--warm)" id="rYes">Ja, zurücksetzen</button></div>`;
    document.getElementById('rNo').onclick = renderSettings;
    document.getElementById('rYes').onclick = () => { state.done={}; state.miss={}; save(); toast('Fortschritt zurückgesetzt.'); go({name:'home'}); };
  };
}

/* ============================================================
   KLICKS (zentral)
   ============================================================ */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.say !== undefined){ speak(t.dataset.say, {other: !!t.dataset.other}); return; }
  if (t.dataset.saySlow !== undefined){ speak(t.dataset.saySlow, {slow:true}); return; }
  if (t.dataset.go){ const [n,id] = t.dataset.go.split(':'); go(id ? {name:n, id} : {name:n}); return; }
  if (t.dataset.goTo){ const id = view.id; if (t.dataset.goTo==='ex') return startLesson(id); go({name:t.dataset.goTo, id}); return; }
  if (t.dataset.act){
    const [a,id] = t.dataset.act.split(':');
    if (a==='open') go({name:'hub', id});
    else if (a==='review') startReview();
    else if (a==='again') startLesson(run.id);
    else if (a==='install' && installEvent){ installEvent.prompt(); installEvent.userChoice.finally(() => { installEvent = null; render(); }); }
    else if (a==='hideinstall'){ state.installHidden = true; save(); render(); }
  }
});

render();
</script>
